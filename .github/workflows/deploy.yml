name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/happy-volta-BBzTA

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            h125wb/package-lock.json
            h145wb/package-lock.json

      - name: Install H125 dependencies
        run: cd h125wb && npm ci

      - name: Build H125
        run: cd h125wb && npm run build

      - name: Install H145 dependencies
        run: cd h145wb && npm ci

      - name: Build H145
        run: cd h145wb && npm run build

      - name: Merge builds
        run: |
          mkdir -p dist
          cp -r h125wb/dist/. dist/
          mkdir -p dist/h145
          cp -r h145wb/dist/. dist/h145/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - id: deployment
        uses: actions/deploy-pages@v4
